services:
  db:
    image: postgres:15-alpine
    container_name: huellitas-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-huellitas}
    ports:
      - "${PORT_DB:-5433}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-huellitas}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    build: ./backend
    container_name: huellitas-api
    environment:
      - PORT=4000
      - DATABASE_URL=postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-huellitas}
      - JWT_SECRET=${JWT_SECRET:-huellitas-dev-secret}
    ports:
      - "${PORT_API:-4000}:4000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - api_uploads:/app/uploads
    restart: unless-stopped

  web:
    build:
      context: ./frontend
      args:
        VITE_API_URL: "http://localhost:${PORT_API:-4000}"
    container_name: huellitas-web
    ports:
      - "${PORT_WEB:-8080}:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  db_data:
  api_uploads:
